[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "empirical-finance-lab"
version = "0.1.1"
description = "Open-source, audit-first tools for credible empirical finance research."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{name = "Muhammad Kamrul Hasan"}]
keywords = ["empirical finance", "event study", "econometrics", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.3,<2.4",
  "scipy>=1.17,<1.18",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
  "coverage>=7.13,<8",
]

[project.urls]
Repository = "https://github.com/mkhasan23/empirical-finance-lab"
Documentation = "https://mkhasan23.github.io/empirical-finance-lab/"
Release = "https://github.com/mkhasan23/empirical-finance-lab/releases/tag/v0.1.1"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
