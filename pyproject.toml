[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "empirical-finance-lab"
version = "0.0.0"
description = "Open-source, audit-first tools for credible empirical finance research."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{name = "Muhammad Kamrul Hasan"}]
keywords = ["empirical finance", "event study", "econometrics", "reproducibility"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mkhasan23/empirical-finance-lab"

[tool.setuptools.packages.find]
where = ["src"]
