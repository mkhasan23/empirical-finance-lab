name: Stage IX formal release

on:
  push:
    branches:
      - main
      - stage-ix-v0.1.0-release
    tags:
      - 'v0.1.0'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage9-required:
    name: stage9-required
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Verify formal v0.1.0 release contract
        run: python tools/check_stage9_release_gate.py
