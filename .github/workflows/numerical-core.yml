name: Stage IV numerical core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numerical-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install frozen Stage IV reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 coverage==7.13.3
          python -m pip install -e . --no-deps
      - name: Verify Stage III authoritative corpus remains unchanged
        run: python tools/check_corpus_integrity.py
      - name: Run Stage IV scientific tests
        run: pytest -q
      - name: Run Stage IV gate audit
        run: python tools/check_stage4_gate.py
