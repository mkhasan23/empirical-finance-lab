name: Stage VI application UI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frozen scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 coverage==7.13.3
          python -m pip install -e . --no-deps
      - name: Verify frozen scientific and browser foundations
        run: |
          python tools/check_corpus_integrity.py
          pytest -q
          python tools/check_stage4_gate.py
          python tools/check_stage5_static_gate.py
          python tools/check_stage6_static_gate.py
      - name: Upload authoritative scientific browser assets
        uses: actions/upload-artifact@v7
        with:
          name: stage6-browser-assets
          path: |
            web/public/efl-core.json
            web/public/stage5-parity-cases.json
            web/public/stage5-runtime-pin.json
          if-no-files-found: error
          retention-days: 1
      - name: Install pinned frontend test dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: TypeScript and unit-test gates
        working-directory: web
        run: |
          npm run typecheck
          npm run test:unit
      - name: Build Stage VI application
        working-directory: web
        run: npm run build

  stage6-ui:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: stage6-ui-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Download authoritative scientific browser assets
        uses: actions/download-artifact@v8
        with:
          name: stage6-browser-assets
          path: web/public
      - name: Install pinned frontend test dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build Stage VI application
        working-directory: web
        run: npm run build
      - name: Install selected Playwright browser
        working-directory: web
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Stage VI end-to-end workflow — ${{ matrix.browser }}
        working-directory: web
        run: npm run test:e2e:stage6 -- --project=${{ matrix.browser }}
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stage6-playwright-${{ matrix.browser }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 3
