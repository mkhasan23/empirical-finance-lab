name: Stage V browser runtime parity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install frozen Stage IV Python environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 coverage==7.13.3
          python -m pip install -e . --no-deps
      - name: Verify Stage III and Stage IV remain green
        run: |
          python tools/check_corpus_integrity.py
          pytest -q
          python tools/check_stage4_gate.py
      - name: Build and statically audit Stage V browser assets
        run: python tools/check_stage5_static_gate.py
      - name: Upload authoritative Stage V browser assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage5-browser-assets
          path: |
            web/public/efl-core.json
            web/public/stage5-parity-cases.json
            web/public/stage5-runtime-pin.json
          if-no-files-found: error
          retention-days: 1
      - name: Install pinned frontend test dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: TypeScript and Vitest gates
        working-directory: web
        run: |
          npm run typecheck
          npm run test:unit
      - name: Build Vite Stage V harness
        working-directory: web
        run: npm run build

  browser-runtime:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: browser-runtime-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Download authoritative Stage V browser assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stage5-browser-assets
          path: web/public
      - name: Install pinned frontend test dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build Vite Stage V harness
        working-directory: web
        run: npm run build
      - name: Stabilize Ubuntu mirror for Playwright system dependencies
        run: |
          test -f /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' \
            'Acquire::Retries "5";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99-efl-ci-network >/dev/null
          test "$(cat /etc/apt/apt-mirrors.txt)" = "https://archive.ubuntu.com/ubuntu/"
      - name: Install selected Playwright browser
        working-directory: web
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Pyodide parity and privacy — ${{ matrix.browser }}
        working-directory: web
        run: npm run test:e2e:stage5 -- --project=${{ matrix.browser }} ${{ matrix.browser == 'webkit' && '--retries=1' || '' }}

  stage5-required:
    name: stage5-required
    needs: [preflight, browser-runtime]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require complete Stage V gate
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BROWSER_RUNTIME_RESULT: ${{ needs.browser-runtime.result }}
        run: |
          test "$PREFLIGHT_RESULT" = "success"
          test "$BROWSER_RUNTIME_RESULT" = "success"
