name: Stage III corpus integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify authoritative corpus
        run: python tools/check_corpus_integrity.py
