name: Stage III corpus integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify authoritative corpus
        run: python tools/check_corpus_integrity.py
