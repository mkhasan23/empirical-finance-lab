name: Stage VII release hardening

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested production artifact to GitHub Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  EFL_BUILD_COMMIT: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify checked-out build provenance
        run: |
          test "$(git rev-parse HEAD)" = "$EFL_BUILD_COMMIT"
          [[ "$EFL_BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install frozen scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 coverage==7.13.3
          python -m pip install -e . --no-deps
      - name: Verify accepted foundation and Stage VII static invariants
        run: |
          python tools/check_stage7_static_gate.py
          python tools/check_stage7_d1_provenance_gate.py
          python tools/check_stage7_e1_onboarding_gate.py
          python tools/check_stage7_e2_accessibility_gate.py
          python tools/check_stage7_f1_release_docs_gate.py
          python tools/check_stage7_f2_evidence_gate.py
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: TypeScript and unit-test gates
        working-directory: web
        run: |
          npm run typecheck
          npm run test:unit
      - name: Build GitHub Pages production candidate
        working-directory: web
        run: npm run build:pages
      - name: Record deterministic production artifact manifest
        run: python tools/stage7_dist_manifest.py write web/dist "$RUNNER_TEMP/stage7-dist-manifest.json"
      - name: Install Chromium for production-like smoke test
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Production subpath parity and privacy smoke
        working-directory: web
        run: npm run test:e2e:stage7
      - name: Verify production artifact unchanged after smoke test
        run: python tools/stage7_dist_manifest.py verify web/dist "$RUNNER_TEMP/stage7-dist-manifest.json"
      - name: Upload tested production dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage7-production-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload production artifact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage7-dist-evidence
          path: ${{ runner.temp }}/stage7-dist-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload Stage VII failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage7-playwright-diagnostics
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/stage-vii-release-hardening' && contains(github.event.head_commit.message, '[deploy-candidate]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download tested production dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stage7-production-dist
          path: web/dist
      - name: Download production artifact evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stage7-dist-evidence
          path: stage7-evidence
      - name: Verify downloaded production artifact
        run: python tools/stage7_dist_manifest.py verify web/dist stage7-evidence/stage7-dist-manifest.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist
      - name: Deploy exact tested artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Download production artifact evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stage7-dist-evidence
          path: stage7-evidence
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for live deployed-site verification
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify exact live artifact, runtime parity, and analysis privacy
        working-directory: web
        env:
          EFL_STAGE7_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
          EFL_STAGE7_MANIFEST: ${{ github.workspace }}/stage7-evidence/stage7-dist-manifest.json
        run: npm run test:e2e:stage7:live
      - name: Upload live deployed-site failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage7-live-playwright-diagnostics
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 3

  evidence:
    needs: [build, deploy, verify-live]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EFL_STAGE7_BUILD_RESULT: ${{ needs.build.result }}
      EFL_STAGE7_DEPLOY_RESULT: ${{ needs.deploy.result }}
      EFL_STAGE7_VERIFY_LIVE_RESULT: ${{ needs.verify-live.result }}
      EFL_STAGE7_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Download production artifact evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: stage7-dist-evidence
          path: stage7-evidence
      - name: Install locked frontend evidence dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Write exact-commit Stage VII acceptance evidence
        run: >-
          python tools/write_stage7_f2_ci_evidence.py
          stage7-evidence/stage7-dist-manifest.json
          "$RUNNER_TEMP/stage7-acceptance-evidence.json"
      - name: Upload Stage VII acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage7-acceptance-evidence
          path: ${{ runner.temp }}/stage7-acceptance-evidence.json
          if-no-files-found: error
          retention-days: 30
